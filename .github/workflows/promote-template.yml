name: Promote Template

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Template to promote'
        required: true
        type: choice
        options:
          - nestjs-template
          - nodejs-template
      from_stage:
        description: 'Source stage'
        required: true
        type: choice
        options:
          - dev
          - int
      to_stage:
        description: 'Target stage'
        required: true
        type: choice
        options:
          - int
          - prod

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # Always promote from main branch
          fetch-depth: 0

      - name: Validate promotion path
        run: |
          if [[ "${{ inputs.from_stage }}" == "dev" && "${{ inputs.to_stage }}" == "int" ]]; then
            echo "Valid promotion path: dev -> int"
          elif [[ "${{ inputs.from_stage }}" == "int" && "${{ inputs.to_stage }}" == "prod" ]]; then
            echo "Valid promotion path: int -> prod"
          else
            echo "::error::Invalid promotion path: ${{ inputs.from_stage }} -> ${{ inputs.to_stage }}"
            echo "Valid paths are: dev -> int, int -> prod"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run promotion script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/promote-template.sh \
            --template "${{ inputs.template }}" \
            --from "${{ inputs.from_stage }}" \
            --to "${{ inputs.to_stage }}"
