name: Automerge Template PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Only run for PRs created by scaffolder-builder-template
    if: startsWith(github.head_ref, 'feat/add-') && endsWith(github.head_ref, '-template')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge PR immediately
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Merging PR #${{ github.event.pull_request.number }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Title: ${{ github.event.pull_request.title }}"

          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --delete-branch
