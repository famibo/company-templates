apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  #namespace: dev   # Commented out only when running locally and using the default namespace
  name: nestjs-template
  title: NestJS Application Template
  description: |
    Create a new NestJS application with TypeScript, working on new experimental features.
    \
    EXPERIMENTAL FEATURES.
    \
    Further customize this template to fit your project's requirements.
  labels:
    version: 1.0.0
    visibility: public
  tags:
    - nestjs
    - typescript
    - backend
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Provide component information
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component (will be used for repo name)
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          description: A brief description of the NestJS application
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.entityRef }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - ${{ user.entityRef }}
        title: 'NestJS Template executed'
        info: 'Your NestJS application ${{ parameters.name }} has been created'
        severity: 'normal'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
