apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  namespace: dev
  name: ${{ values.templateName }}
  title: ${{ values.templateName | replace("-template", "") | replace("-", " ") | title }} Template
  description: |
    ${{ values.description }}
  labels:
    version: ${{ values.initialVersion }}
    visibility: ${{ values.visibility }}
  tags:
    - custom
spec:
  owner: ${{ values.owner }}
  type: service

  parameters:
    - title: Component Information
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          description: A brief description of the component
    - title: Ownership
      required:
        - owner
      properties:
        owner:
          title: Owner
          type: string
          description: The team that owns this component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetchBase
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: {% raw %}${{ parameters.name }}{% endraw %}
          description: {% raw %}${{ parameters.description }}{% endraw %}
          owner: {% raw %}${{ parameters.owner }}{% endraw %}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: {% raw %}${{ parameters.description }}{% endraw %}
        repoUrl: {% raw %}${{ parameters.repoUrl }}{% endraw %}
        defaultBranch: main
        repoVisibility: ${{ values.visibility }}

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: {% raw %}${{ steps['publish'].output.repoContentsUrl }}{% endraw %}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: {% raw %}${{ steps['publish'].output.remoteUrl }}{% endraw %}
      - title: Open in catalog
        icon: catalog
        entityRef: {% raw %}${{ steps['register'].output.entityRef }}{% endraw %}
