apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  namespace: dev
  name: scaffolder-builder-template
  title: Backstage Template Builder
  description: |
    Meta-template for creating new Backstage templates following the company's staging concept.
    \
    This template generates a complete template structure with dev/int/prod stages.
    \
    NOTE: This template exists only in dev stage and cannot be promoted.
  labels:
    version: 1.0.0
    visibility: private
    promotable: "false"
  tags:
    - meta-template
    - scaffolder
    - platform
    - internal
spec:
  owner: group:default/platform-team
  type: template

  parameters:
    - title: Template Information
      required:
        - templateName
        - description
      properties:
        templateName:
          title: Template Name
          type: string
          description: |
            Name of the new template (e.g., "myteam-service-template").
            Must follow naming convention: <team>-<name>-template
          ui:autofocus: true
          pattern: '^[a-z0-9]+-[a-z0-9-]+-template$'
          ui:help: 'Format: <team>-<name>-template (lowercase, hyphens allowed)'
        description:
          title: Description
          type: string
          description: A brief description of what this template creates
          ui:options:
            rows: 3
    - title: Template Ownership & Settings
      required:
        - owner
      properties:
        owner:
          title: Owner
          type: string
          description: The team that owns this template
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
        initialVersion:
          title: Initial Version
          type: string
          description: Starting version for the template
          default: '0.0.1'
          pattern: '^\d+\.\d+\.\d+$'
        visibility:
          title: Visibility
          type: string
          description: Template visibility setting
          default: private
          enum:
            - private
            - public
            - restricted
          enumNames:
            - Private (visible to owner team only)
            - Public (visible to all)
            - Restricted (visible to owner team + descendant teams)

  steps:
    - id: fetchTemplate
      name: Generate Template Structure
      action: fetch:template
      input:
        url: ./content
        targetPath: templates/${{ parameters.templateName }}
        values:
          templateName: ${{ parameters.templateName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          initialVersion: ${{ parameters.initialVersion }}
          visibility: ${{ parameters.visibility }}

    - id: createPullRequest
      name: Create Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=famibo&repo=company-templates
        branchName: feat/add-${{ parameters.templateName }}
        title: 'feat: Add new template ${{ parameters.templateName }}'
        description: |
          ## New Template: ${{ parameters.templateName }}

          **Description:** ${{ parameters.description }}

          **Owner:** ${{ parameters.owner }}

          **Initial Version:** ${{ parameters.initialVersion }}

          **Visibility:** ${{ parameters.visibility }}

          ---

          This PR was automatically generated by the scaffolder-builder-template.

          ### Checklist
          - [ ] Review template.yaml configuration
          - [ ] Review sample content files
          - [ ] Verify owner is correct
          - [ ] Test template in dev stage after merge

  output:
    links:
      - title: Pull Request
        url: ${{ steps['createPullRequest'].output.pullRequestUrl }}
    text:
      - title: Next Steps
        content: |
          1. Review and merge the PR
          2. Test the template in dev stage
          3. Promote to int stage when ready using:
             ./scripts/promote-template.sh --template ${{ parameters.templateName }} --from dev --to int
             OR using the Promote Template action in GitHub.
